name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    # Optional: Run 2 servers at once to cut test time in half!
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🟢 The Official Action takes over here!
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Tell it how to boot your Vite server
          start: npm run dev

          # Tell it where to wait for Vite to be ready
          wait-on: 'http://localhost:5173'

          # Send the video and analytics to the cloud
          record: true
          parallel: true

        env:
          # Your secret key we set up earlier
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

          # GitHub provides this token automatically behind the scenes!
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}